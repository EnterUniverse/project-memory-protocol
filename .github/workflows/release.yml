name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: pmem privacy scan .
      - name: Verify tag and package version agree
        run: test "v$(python -c 'import project_memory_protocol; print(project_memory_protocol.__version__)')" = "$GITHUB_REF_NAME"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Publish GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
