name: Feature request
description: Propose a focused improvement to the tool or file formats.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: failure
    attributes:
      label: Problem
      description: What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal example
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Alternatives and trade-offs
    validations:
      required: true
