[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "project-memory-protocol"
version = "0.1.0"
description = "Evidence-grounded, provenance-linked project memory for long-horizon agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jinyu Xu" }]
keywords = ["agents", "memory", "provenance", "reproducibility", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.6", "twine>=5"]

[project.scripts]
pmem = "project_memory_protocol.cli:main"

[project.urls]
Documentation = "https://github.com/EnterUniverse/project-memory-protocol#readme"
Issues = "https://github.com/EnterUniverse/project-memory-protocol/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/project_memory_protocol"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
